[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boeing747-model"
version = "0.1.0"
description = "Boeing 747 dynamics and control models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "runge-kutta",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyright",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
